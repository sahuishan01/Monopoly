name: Android build

# Runs on release tags only: builds the Nearby plugin, then the APK and AAB with Gradle so that
# the plugin and its Play Services dependency are included.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          # The runner image already ships the SDK; only make sure what the build needs is there.
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the Nearby Connections plugin
        working-directory: android/NearbyConnectionsPlugin
        run: gradle :plugin:deployToGodot

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$(ls $HOME/godot/*/Godot_v*_mono_linux.x86_64)" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates"
          mv "$HOME/.local/share/godot/export_templates/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"

      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Every build must be signed with the one permanent key, otherwise it cannot be
          # installed as an update. Never fall back to a generated key.
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Check that the tag matches the game version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n -E 's/^config\/version="(.*)"/\1/p' client/project.godot)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version (run tools/set-version.sh)"
            exit 1
          fi

      - name: Export
        env:
          BOARDEMPIRE_KEYSTORE: ${{ runner.temp }}/release.keystore
          BOARDEMPIRE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BOARDEMPIRE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          "$GODOT" --headless --path client --import
          mkdir -p client/android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/android_source.zip" -d client/android/build
          touch client/android/build/.gdignore
          cp "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/version.txt" client/android/.build_version
          cp "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/version.txt" client/android/build/.build_version
          chmod +x client/android/build/gradlew
          tools/build-android.sh "Android (Gradle)"

      - uses: actions/upload-artifact@v4
        with:
          name: boardempire-android
          path: client/build/*.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/build/*.apk

