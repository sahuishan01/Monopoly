name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: betest
          POSTGRES_DB: boardempire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      BOARDEMPIRE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=betest;Database=boardempire
      BOARDEMPIRE_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test rules engine, protocol, networking and server
        run: dotnet test BoardEmpire.sln -c Release --logger "console;verbosity=minimal"
      - name: Balance smoke test (2,000 simulated matches)
        run: dotnet run --project tools/Simulator -c Release -- --games 2000 --players 4

  server-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t boardempire-server .
